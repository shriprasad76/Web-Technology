<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Evaluation System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Evaluation System</h1>

    <section class="card">
      <h2>Add Student</h2>
      <form id="student-form">
        <label for="student-name">Name</label>
        <input type="text" id="student-name" placeholder="Enter student name" required />

        <label for="student-marks">Marks</label>
        <input type="number" id="student-marks" placeholder="Enter marks" required min="0" max="100" />

        <button type="submit">Add Student</button>
      </form>
    </section>

    <section class="card actions">
      <button id="load-students">Load All Students</button>
    </section>

    <section class="card">
      <h2>Student List</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Marks</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <tr><td colspan="4">No students loaded yet.</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
