<div class="container" style="padding: 20px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Student List</h2>
    
    @if (students().length === 0) {
        <p style="text-align: center; color: gray;">No students found. Please add a student.</p>
    } @else {
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <thead>
                <tr style="background-color: #3498db; color: white;">
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">ID</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Name</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Age</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Course</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (student of students(); track student.id) {
                    <tr>
                        <td style="border: 1px solid #ddd; padding: 10px;">{{ student.id }}</td>
                        <td style="border: 1px solid #ddd; padding: 10px;">{{ student.name }}</td>
                        <td style="border: 1px solid #ddd; padding: 10px;">{{ student.age }}</td>
                        <td style="border: 1px solid #ddd; padding: 10px;">{{ student.course }}</td>
                        <td style="border: 1px solid #ddd; padding: 10px; text-align: center;">
                            <button (click)="viewStudent(student.id)" style="margin-right: 5px; padding: 5px 10px; background-color: #2ecc71; color: white; border: none; border-radius: 3px; cursor: pointer;">View</button>
                            <button (click)="editStudent(student.id)" style="margin-right: 5px; padding: 5px 10px; background-color: #f39c12; color: white; border: none; border-radius: 3px; cursor: pointer;">Edit</button>
                            <button (click)="deleteStudent(student.id)" style="padding: 5px 10px; background-color: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">Delete</button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    }
</div>
